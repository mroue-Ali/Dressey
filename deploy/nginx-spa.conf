# nginx inside the container: serves the built SPA. TLS and the domain are handled by
# the host's nginx (deploy/dressey.mroueali.com.conf), which proxies to this.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /dresses/123) load index.html,
    # which must never be cached so new deploys show up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Host nginx: /etc/nginx/sites-available/dressey.mroueali.com, symlinked into sites-enabled.
# Plain HTTP only; `sudo certbot --nginx -d dressey.mroueali.com` adds the TLS block.
server {
    listen 80;
    listen [::]:80;
    server_name dressey.mroueali.com;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
